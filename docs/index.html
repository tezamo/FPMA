<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title><h1>FPMA Wheat & Bread Prices Data</h1></title>
  <!-- Handsontable CSS + JS (free for open-source) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { color: #333; }
    .container { max-width: 100%; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your Data Title (edit this)</h1>
    <p><a href="../excel_files/wheat_bread.xlsx">Download Excel file</a> | 
       <a href="https://github.com/tezamo/FPMA">Back to repository</a></p>
    <div id="excel-table" style="margin-top: 20px;"></div>
  </div>

<script>
  const excelFileUrl = '../excel_files/wheat_bread.xlsx';  // correct for your folder

  const hotElement = document.querySelector('#excel-table');

  fetch(excelFileUrl)
    .then(response => {
      if (!response.ok) throw new Error('File not found or blocked by CORS');
      return response.arrayBuffer();
    })
    .then(arrayBuffer => {
      // Use SheetJS (already bundled with Handsontable full)
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      // Convert to array of arrays (Handsontable format)
      const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

      new Handsontable(hotElement, {
        data: jsonData,
        rowHeaders: true,
        colHeaders: true,
        filters: true,
        dropdownMenu: true,
        columnSorting: true,
        contextMenu: ['copy'],
        stretchH: 'all',
        height: 'auto',
        readOnly: true,
        licenseKey: 'non-commercial-and-evaluation' // required for open-source
      });
    })
    .catch(err => {
      hotElement.innerHTML = `<p style="color:red;">Error loading the file:<br>${err.message}</p>`;
    });
</script>

</body>
</html>
